name: PR173 one-shot Black

on:
  push:
    branches:
      - fix/dashboard-trailing-protection-display
    paths:
      - .github/workflows/pr173-black.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-trailing-protection-display
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install black==25.9.0
      - name: Apply Black
        run: |
          black tests/test_dashboard_trailing_display_20260908.py
          rm -f .github/workflows/pr173-black.yml
      - name: Commit
        run: |
          git config user.name 'pr173-format-bot'
          git config user.email 'pr173-format-bot@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply Black to PR173 test'
          git push origin HEAD:fix/dashboard-trailing-protection-display
