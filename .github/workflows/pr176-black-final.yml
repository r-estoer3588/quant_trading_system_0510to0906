name: PR176 final one-shot Black

on:
  push:
    branches:
      - fix/s1-s4-trailing-protection-20260910

permissions:
  contents: write

jobs:
  black-final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s1-s4-trailing-protection-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify clean branch and upstream
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch origin main fix/s1-s4-trailing-protection-20260910
          git merge-base --is-ancestor origin/main HEAD
          git rebase --autostash origin/main
          test -z "$(git status --porcelain)"
      - name: Black only the CI-reported wrapper
        run: |
          python -m pip install black==25.9.0
          black scripts/export_alpaca_snapshot.py
      - name: Commit exact path and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/pr176-black-final.yml
          git add -- scripts/export_alpaca_snapshot.py
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' \
            .github/workflows/pr176-black-final.yml \
            scripts/export_alpaca_snapshot.py | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/staged.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: Black-format snapshot protection wrapper'
      - name: Push without force
        shell: bash
        run: |
          set -euo pipefail
          pgrep -a git || true
          git push origin HEAD:fix/s1-s4-trailing-protection-20260910
