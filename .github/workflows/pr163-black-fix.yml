name: PR163 Black Fix

on:
  push:
    branches:
      - claude/openrun-record-hardening-20260825

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/openrun-record-hardening-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Black
        run: python -m pip install black==25.9.0
      - name: Format the two CI-reported files
        run: black scripts/open_auto_run.py tests/test_open_auto_run_run_record.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "pr163-format-bot"
          git config user.email "pr163-format-bot@users.noreply.github.com"
          git add scripts/open_auto_run.py tests/test_open_auto_run_run_record.py
          git commit -m "style(open-run): apply pinned Black formatting"
          git push origin HEAD:claude/openrun-record-hardening-20260825
