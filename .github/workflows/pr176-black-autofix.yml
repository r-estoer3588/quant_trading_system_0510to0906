name: PR176 one-shot black autofix

on:
  push:
    branches:
      - fix/s1-s4-trailing-protection-20260910

permissions:
  contents: write

jobs:
  black-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s1-s4-trailing-protection-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify clean branch and upstream
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch origin main fix/s1-s4-trailing-protection-20260910
          git merge-base --is-ancestor origin/main HEAD
          git rebase --autostash origin/main
          test -z "$(git status --porcelain)"
      - name: Black exactly the three CI-reported files
        run: |
          python -m pip install black==25.9.0
          black \
            common/soft_trailing.py \
            scripts/export_alpaca_snapshot.py \
            tests/test_s1_s4_soft_trailing_20260910.py
      - name: Commit only explicit paths and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/pr176-black-autofix.yml
          git add -- \
            common/soft_trailing.py \
            scripts/export_alpaca_snapshot.py \
            tests/test_s1_s4_soft_trailing_20260910.py
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' \
            .github/workflows/pr176-black-autofix.yml \
            common/soft_trailing.py \
            scripts/export_alpaca_snapshot.py \
            tests/test_s1_s4_soft_trailing_20260910.py | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/staged.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: black-format S1/S4 trailing fix'
      - name: Push without force
        shell: bash
        run: |
          set -euo pipefail
          pgrep -a git || true
          git push origin HEAD:fix/s1-s4-trailing-protection-20260910
