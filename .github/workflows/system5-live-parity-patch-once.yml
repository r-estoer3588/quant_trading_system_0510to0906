name: System5 live parity one-shot patch

on:
  push:
    branches:
      - fix/system5-live-exit-parity-20260910

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system5-live-exit-parity-20260910
          fetch-depth: 0
      - name: Apply targeted integration patch
        run: python tools/_patch_system5_live_parity_20260910.py
      - name: Remove one-shot machinery
        run: |
          rm tools/_patch_system5_live_parity_20260910.py
          rm .github/workflows/system5-live-parity-patch-once.yml
      - name: Commit patched integration
        run: |
          git config user.name "system5-parity-bot"
          git config user.email "system5-parity-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(system5): wire canonical live exits into paper execution and dashboard"
          git push origin HEAD:fix/system5-live-exit-parity-20260910
