name: PR173 one-shot patch

on:
  push:
    branches:
      - fix/dashboard-trailing-protection-display
    paths:
      - .github/workflows/pr173-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-trailing-protection-display
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements.txt
      - name: Apply PR173 patch
        run: python tools/_pr173_apply.py
      - name: Run focused tests
        run: |
          python -m pytest -q tests/test_dashboard_trailing_display_20260908.py tests/test_export_alpaca_snapshot.py tests/test_alpaca_exit_orders.py
      - name: Remove one-shot helper
        run: rm -f tools/_pr173_apply.py .github/workflows/pr173-apply.yml
      - name: Commit implementation
        run: |
          git config user.name 'pr173-fix-bot'
          git config user.email 'pr173-fix-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(dashboard): distinguish trailing protection state' || exit 0
          git push origin HEAD:fix/dashboard-trailing-protection-display
